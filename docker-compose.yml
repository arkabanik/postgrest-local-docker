services:
  db:
    image: postgres:16-alpine
    container_name: postgrest-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
    volumes:
      # Automatically runs the SQL script on initial startup
      - ./init_datasource.sql:/docker-entrypoint-initdb.d/init_datasource.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: postgrest-api
    ports:
      - "3000:3000"
    environment:
      # Connection URI format: postgres://user:password@host:port/database
      PGRST_DB_URI: postgres://postgres:postgrespass@db:5432/app_db
      # The database schema that handles API endpoints
      PGRST_DB_SCHEMA: api
      # The database role used for unauthenticated requests
      PGRST_DB_ANON_ROLE: web_anon
    depends_on:
      db:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: swagger-ui
    ports:
      - "8080:8080"
    environment:
      # Directs Swagger UI to pull the OpenAPI spec directly from PostgREST root
      API_URL: http://localhost:3000/
    depends_on:
      - postgrest

  redis:
    image: redis/redis-stack:latest
    container_name: abeg-redis
    ports:
      - "6379:6379"
    volumes:
      - abeg_redis_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  abeg_redis_data:
